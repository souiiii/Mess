services:
  iiit-mess:
    build:
      context: .
      dockerfile: Dockerfile
    image: iiit-mess:latest
    container_name: iiit-mess
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-4000}:4000"
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_PATH: /app/data/mess.sqlite
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN to your public https:// origin}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      PAYMENTS_MODE: ${PAYMENTS_MODE:-FAKE}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - iiit-mess-data:/app/data
      - iiit-mess-backups:/app/backups
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  iiit-mess-data:
  iiit-mess-backups:

